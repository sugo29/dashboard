# Streamlit Secrets Configuration
# For local development - these URLs will be used
KITCHEN_DASHBOARD_URL = "http://localhost:8501"
VARIANCE_DASHBOARD_URL = "http://localhost:8502"

# For deployment, update these with your actual deployed URLs
# Examples for different deployment platforms:

# Streamlit Cloud:
# KITCHEN_DASHBOARD_URL = "https://your-kitchen-dashboard.streamlit.app"
# VARIANCE_DASHBOARD_URL = "https://your-variance-dashboard.streamlit.app"

# Heroku:
# KITCHEN_DASHBOARD_URL = "https://your-kitchen-dashboard.herokuapp.com"
# VARIANCE_DASHBOARD_URL = "https://your-variance-dashboard.herokuapp.com"

# AWS/Azure/GCP:
# KITCHEN_DASHBOARD_URL = "https://your-kitchen-dashboard.your-domain.com"
# VARIANCE_DASHBOARD_URL = "https://your-variance-dashboard.your-domain.com"

# Custom Domain:
# KITCHEN_DASHBOARD_URL = "https://kitchen.yourdomain.com"
# VARIANCE_DASHBOARD_URL = "https://variance.yourdomain.com"
